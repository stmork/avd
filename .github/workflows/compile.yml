name: Build Amiga Video Digitizer for test purposes
on: [push]

jobs:
  AVD-Ubuntu:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update package info
        run: sudo apt update -y
      - name: Install needed components
        run: sudo apt install -y cppcheck
      - name: CMake
        run: cmake -B build
      - name: Build
        run: make -C build
      - name: CPP-Check
        run: make -C build cppcheck
